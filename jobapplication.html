<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Apply for a job at Sustainable Energy Solutions Company.">
    <meta name="keywords" content="sustainable energy, renewable energy, solar, wind, clean energy, careers">
    <meta name="author" content="Group G03">
    <title>Apply | Sustainable Energy Solutions</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sustainable Energy Solutions</h1>
        <nav>
            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="jobdescription.html">Job Descriptions</a></li>
                <li><a href="jobapplication.html">Apply</a></li>
                <li><a href="aboutus.html">About Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Job Application Form</h2>

        <form method="post" action="#">
            <fieldset>
                <legend>Position</legend>
                <label for="jobref">Job reference number</label>
                <select id="jobref" name="jobref" required>
                    <option value="">Please select</option>
                    <option value="SE001">SE001 - Software Developer</option>
                    <option value="SE002">SE002 - Data Analyst</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Personal Details</legend>
                <p>
                    <label for="firstname">First name</label>
                    <input type="text" id="firstname" name="firstname" maxlength="20" pattern="[A-Za-z]+" required>
                </p>
                <p>
                    <label for="lastname">Last name</label>
                    <input type="text" id="lastname" name="lastname" maxlength="20" pattern="[A-Za-z]+" required>
                </p>
                <p>
                    <label for="dob">Date of birth</label>
                    <input type="date" id="dob" name="dob" required>
                </p>
                <fieldset>
                    <legend>Gender</legend>
                    <input type="radio" id="female" name="gender" value="female" required>
                    <label for="female">Female</label>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                </fieldset>
            </fieldset>

            <fieldset>
                <legend>Contact Details</legend>
                <p>
                    <label for="address">Street address</label>
                    <input type="text" id="address" name="address" maxlength="40" required>
                </p>
                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9 ]{8,12}" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>Skills</legend>
                <input type="checkbox" id="html" name="skills[]" value="html" checked>
                <label for="html">HTML/CSS</label>
                <input type="checkbox" id="js" name="skills[]" value="javascript">
                <label for="js">JavaScript</label>
                <input type="checkbox" id="sql" name="skills[]" value="sql">
                <label for="sql">SQL</label>
                <input type="checkbox" id="python" name="skills[]" value="python">
                <label for="python">Python</label>
                <p>
                    <label for="otherskills">Other skills</label><br>
                    <textarea id="otherskills" name="otherskills" rows="4" cols="40"></textarea>
                </p>
            </fieldset>

            <p>
                <input type="submit" value="Apply">
                <input type="reset" value="Reset">
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Sustainable Energy Solutions Company. Group G03, COS10026 Web Technology Project.</p>
    </footer>
</body>
</html>
