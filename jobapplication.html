  <main>
    <h2>Join Our Team</h2>

    <!-- Application panel: the form scrolls inside it -->
    <section class="apply-panel" aria-labelledby="panel-heading">
      <div class="panel-header">
        <h3 id="panel-heading">Job Application</h3>
        <p>Scroll through each section, then submit.</p>
      </div>

      <form id="application-form"
            action="https://mercury.swin.edu.au/it000000/formtest.php"
            method="post">

        <!-- Scrollable area -->
        <div class="panel-scroll">

          <!-- Inline CSS example -->
          <p class="form-intro" style="font-weight: bold;">
            All fields are required except "Other skills". Choose the position you are
            applying for. You can read the details on the <a href="jobs.html">Jobs page</a>.
          </p>

          <div class="sections">

            <!-- Section 1: Job details -->
            <fieldset class="wide">
              <legend>Position</legend>
              <div class="field">
                <label for="jobref">Job reference number (select a position)</label>
                <!-- Values are the exact 5-character reference numbers from jobs.html -->
                <select id="jobref" name="jobref" required>
                  <option value="">Please select a position</option>
                  <option value="WD101">WD101 - Front-End Web Developer</option>
                  <option value="UX202">UX202 - UX/UI Designer</option>
                  <option value="RE201">RE201 - Renewable Energy Project Engineer</option>
                  <option value="DA301">DA303 - Data Analyst - Energy Systems</option>
                </select>
              </div>
            </fieldset>

            <!-- Section 2: Personal details -->
            <fieldset>
              <legend>Personal details</legend>

              <div class="field">
                <label for="firstname">First name</label>
                <input type="text" id="firstname" name="firstname"
                       pattern="[A-Za-z]{1,20}" maxlength="20" required
                       title="Letters only, maximum 20 characters">
              </div>

              <div class="field">
                <label for="lastname">Last name</label>
                <input type="text" id="lastname" name="lastname"
                       pattern="[A-Za-z]{1,20}" maxlength="20" required
                       title="Letters only, maximum 20 characters">
              </div>

              <div class="field">
                <label for="dob">Date of birth</label>
                <input type="text" id="dob" name="dob"
                       pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}"
                       placeholder="dd/mm/yyyy" maxlength="10" required
                       title="Use the format dd/mm/yyyy">
              </div>

              <fieldset class="radio-group">
                <legend>Gender</legend>
                <label><input type="radio" name="gender" value="female" required> Female</label>
                <label><input type="radio" name="gender" value="male"> Male</label>
                <label><input type="radio" name="gender" value="undisclosed"> Prefer not to say</label>
              </fieldset>
            </fieldset>

            <!-- Section 3: Address and contact -->
            <fieldset>
              <legend>Address and contact</legend>

              <div class="field">
                <label for="street">Street address</label>
                <input type="text" id="street" name="street" maxlength="40" required>
              </div>

              <div class="field">
                <label for="suburb">Suburb/Town</label>
                <input type="text" id="suburb" name="suburb" maxlength="40" required>
              </div>

              <div class="field">
                <label for="state">State</label>
                <select id="state" name="state" required>
                  <option value="">Please select</option>
                  <option value="VIC">VIC</option>
                  <option value="NSW">NSW</option>
                  <option value="QLD">QLD</option>
                  <option value="NT">NT</option>
                  <option value="WA">WA</option>
                  <option value="SA">SA</option>
                  <option value="TAS">TAS</option>
                  <option value="ACT">ACT</option>
                </select>
              </div>

              <div class="field">
                <label for="postcode">Postcode</label>
                <input type="text" id="postcode" name="postcode"
                       pattern="[0-9]{4}" maxlength="4" required
                       title="Exactly 4 digits">
              </div>

              <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
              </div>

              <div class="field">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone"
                       pattern="[0-9]{8,12}" maxlength="12" required
                       title="8 to 12 digits, no spaces">
              </div>
            </fieldset>

            <!-- Section 4: Skills -->
            <fieldset class="wide skills">
              <legend>Skills</legend>

              <label><input type="checkbox" name="skills[]" value="html5"> HTML5</label>
              <label><input type="checkbox" name="skills[]" value="css3"> CSS3</label>
              <label><input type="checkbox" name="skills[]" value="accessibility"> Accessibility</label>
              <label><input type="checkbox" name="skills[]" value="git"> Git/GitHub</label>
              <label><input type="checkbox" name="skills[]" value="teamwork"> Teamwork</label>

              <div class="field">
                <label for="otherskills">Other skills</label>
                <textarea id="otherskills" name="otherskills" rows="5" cols="40"
                          placeholder="Tell us about any other relevant skills"></textarea>
              </div>
            </fieldset>
          </div>
        </div>

        <!-- Buttons stay visible at the bottom of the panel -->
        <div class="form-buttons">
          <button type="submit">Submit application</button>
          <button type="reset">Clear form</button>
        </div>
      </form>
    </section>
